<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sparkboard</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #14141a;
        color: #f5f5f7;
      }
      .starter {
        max-width: 40rem;
        margin: 6rem auto;
        padding: 0 1.5rem;
        text-align: center;
      }
      .starter h1 {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
      }
      .starter p {
        color: #a5a5b0;
        line-height: 1.6;
      }
      .starter a {
        color: #7aa2f7;
      }
      #app:not(:empty) + .starter {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Starter screen shipped with the project template. Replace with the
         real landing content once the boards view is wired up. -->
    <section class="starter">
      <h1>Hello from the starter</h1>
      <p>
        Edit <code>src/main.js</code> and save to reload. Read the
        <a href="https://nodejs.org/api/esm.html">module docs</a> to learn more.
      </p>
      <p>Vanilla JavaScript &middot; no build step</p>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
